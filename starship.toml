format = """
$os $username $directory$git_branch$git_status$nodejs$python$cmd_duration
$character
"""

# Performance
scan_timeout = 30
command_timeout = 500

# OS Symbol
[os]
disabled = false
style = "fg:#fabd2f"
format = "[$symbol]($style) "

[os.symbols]
Macos = "󰀵"
Ubuntu = "󰕈"
Arch = "󰣇"
Debian = "󰣚"
Fedora = "󰣛"
Redhat = "󱄛"
Linux = "󰌽"
Windows = "󰍲"

# Username
[username]
show_always = true
style_user = "fg:#83a598"
format = "[$user]($style) "

# Symbols and character
[character]
success_symbol = "[➜](bold green)"
error_symbol = "[✗](bold red)"

# Directory styling
[directory]
truncation_length = 10
truncate_to_repo = false
style = "bold fg:#a89984"

# Git info
[git_branch]
symbol = " "
style = "fg:#fabd2f"
format = "[$symbol$branch]($style) "

[git_status]
style = "fg:#83a598"
format = '([$all_status$ahead_behind]($style) )'
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
staged = "+${count}"
modified = "~${count}"
deleted = "-${count}"
stashed = "≡"
conflicted = "!"

[cmd_duration]
min_time = 2000
format = "[󱎫 $duration]($style) "
style = "fg:#fabd2f"

# Node.js
[nodejs]
symbol = " "
format = "[$symbol$version]($style) "
style = "fg:#b8bb26"
disabled = false

# Python
[python]
symbol = " "
format = "[$symbol$version]($style) "
style = "fg:#8ec07c"
disabled = false
detect_extensions = ["py", "pyi", "pyc", "pyo", "pyw", "pyz"]
detect_files = [
  "requirements.txt",
  "pyproject.toml",
  "Pipfile",
  "tox.ini",
  "setup.py",
  "__init__.py",
]
detect_folders = [".venv", "venv", "env", ".python-version"]

# Performance boost: disable everything else
[aws]
disabled = true
[azure]
disabled = true
[bun]
disabled = true
[buf]
disabled = true
[crystal]
disabled = true
[cmake]
disabled = true
